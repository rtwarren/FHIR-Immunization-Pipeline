name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore tests/FHIRPipeline.Tests/FHIRPipeline.Tests.csproj
      - name: Build
        run: dotnet build tests/FHIRPipeline.Tests/FHIRPipeline.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/FHIRPipeline.Tests/FHIRPipeline.Tests.csproj -c Release --no-build --logger "console;verbosity=normal" --collect:"XPlat Code Coverage"

  sql:
    name: SQL Server schema and merge tests
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Only_Passw0rd!"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - name: Configure sqlcmd
        run: echo "SQLCMD=docker exec -i ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Only_Passw0rd! -C -b" >> "$GITHUB_ENV"
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 30); do
            if $SQLCMD -Q "SELECT 1" > /dev/null 2>&1; then echo "ready"; exit 0; fi
            sleep 2
          done
          echo "SQL Server did not start"; exit 1
      - name: Create database
        run: $SQLCMD -Q "CREATE DATABASE FHIRPipeline;"
      - name: Apply schema, procedures and views
        run: |
          for f in sql/01_schema.sql sql/02_procedures.sql sql/03_reporting_views.sql; do
            echo "Applying $f"
            $SQLCMD -d FHIRPipeline < "$f"
          done
      - name: Re-apply to prove scripts are idempotent
        run: |
          for f in sql/01_schema.sql sql/02_procedures.sql sql/03_reporting_views.sql; do
            $SQLCMD -d FHIRPipeline < "$f"
          done
      - name: Run SQL tests
        run: $SQLCMD -d FHIRPipeline < tests/sql/test_merge.sql
