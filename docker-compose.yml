# Local SQL Server for development. Not for production use.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in your shell or .env}"
    ports:
      - "1433:1433"
    volumes:
      - ./sql:/sql:ro
